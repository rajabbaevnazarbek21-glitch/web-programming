<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 4</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }
    .outer {
      background: #fef3c7;
      padding: 30px;
      border: 2px solid #fbbf24;
      display: grid;
      place-items: center;
    }
    .middle {
      background: #e2e8f0;
      padding: 30px;
      border: 3px solid #475569;
      display: grid;
      place-items: center;
    }
    .inner {
      background: #dbeafe;
      padding: 30px;
      border: 2px solid #60a5fa;
      display: grid;
      place-items: center;
    }
    .content {
      background: #ddd6fe;
      padding: 30px;
      border: 2px solid #8b5cf6;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="middle">
      <div class="inner">
        <div class="content">Content</div>
      </div>
    </div>
  </div>
</body>
</html>
