<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3</title>
  <style>
    .palette {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .swatch {
      width: 120px;
      height: 110px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="palette">
    <div class="swatch" style="background:#FF6B6B;">#FF6B6B</div>
    <div class="swatch" style="background:#4ECDC4;">#4ECDC4</div>
    <div class="swatch" style="background:#FFD93D;">#FFD93D</div>
    <div class="swatch" style="background:#1A535C;">#1A535C</div>
    <div class="swatch" style="background:#6C5CE7;">#6C5CE7</div>
  </div>
</body>
</html>
