<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 7</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f0fdf4;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #15803d;
      color: white;
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: bold;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .role {
      margin: 4px 0 0;
      color: #64748b;
    }
    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 18px 0;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .badge {
      background: #dcfce7;
      color: #15803d;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="profile">
      <div class="avatar">N</div>
      <div>
        <h1>Nazarbek</h1>
        <p class="role">Computer Engineering Student</p>
      </div>
    </div>
    <hr />
    <div class="skills">
      <span class="badge">Sports</span>
      <span class="badge">Computers</span>
      <span class="badge">Programming</span>
      <span class="badge">Engineering</span>
    </div>
  </div>
</body>
</html>
