<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12_1 | E3: Lifting State to a Score Board | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}
.wrap{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.author{font-size:.85rem;color:#64748b;margin:0 0 4px}
h1{font-size:1.35rem;margin:0 0 16px;color:#4f46e5}
button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.95rem;margin:4px 4px 4px 0}
button.secondary{background:#e2e8f0;color:#0f172a}
button:hover{opacity:.9}
input,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-family:inherit}
label{display:block;font-weight:600;margin:10px 0 4px}
ul{padding-left:0;list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
.done{text-decoration:line-through;color:#94a3b8}
.msg{margin-top:12px;padding:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534} .err{background:#fee2e2;color:#991b1b}

.players{display:flex;gap:12px}.player{flex:1;text-align:center;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.player .score{font-size:2.4rem;font-weight:700}.total{text-align:center;font-size:1.2rem;margin-top:14px}</style>
</head>
<body>
<div class="wrap">
<p class="author">Rajabbaev Nazarbek · Student ID 202637334 · Week 12_1</p>
<h1>E3: Lifting State to a Score Board</h1>
<div id="root"></div>
</div>
<script type="text/babel">
const { useState } = React;

// Child: gets its score and a callback from the parent
function PlayerScore({ name, score, onAdd }) {
  return (
    <div className="player">
      <h2>{name}</h2>
      <div className="score">{score}</div>
      <button onClick={onAdd}>+1 point</button>
    </div>
  );
}

// Parent: owns the state for BOTH players (state is lifted up)
function ScoreBoard() {
  const [scores, setScores] = useState({ p1: 0, p2: 0 });
  const add = key => setScores(prev => ({ ...prev, [key]: prev[key] + 1 }));
  const total = scores.p1 + scores.p2; // derived from state

  return (
    <>
      <div className="players">
        <PlayerScore name="Nazarbek" score={scores.p1} onAdd={() => add("p1")} />
        <PlayerScore name="Player 2" score={scores.p2} onAdd={() => add("p2")} />
      </div>
      <p className="total">Total: <strong>{total}</strong></p>
      <div style={{ textAlign: "center" }}>
        <button className="secondary" onClick={() => setScores({ p1: 0, p2: 0 })}>Reset</button>
      </div>
    </>
  );
}

function App() { return <ScoreBoard />; }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
