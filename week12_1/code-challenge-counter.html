<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12_1 | Code Challenge: Counter with History & Undo | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}
.wrap{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.author{font-size:.85rem;color:#64748b;margin:0 0 4px}
h1{font-size:1.35rem;margin:0 0 16px;color:#4f46e5}
button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.95rem;margin:4px 4px 4px 0}
button.secondary{background:#e2e8f0;color:#0f172a}
button:hover{opacity:.9}
input,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-family:inherit}
label{display:block;font-weight:600;margin:10px 0 4px}
ul{padding-left:0;list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
.done{text-decoration:line-through;color:#94a3b8}
.msg{margin-top:12px;padding:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534} .err{background:#fee2e2;color:#991b1b}

.count{font-size:3rem;font-weight:700;text-align:center;margin:8px 0}.row{text-align:center}.hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.hist span{background:#e0e7ff;border-radius:6px;padding:3px 9px}</style>
</head>
<body>
<div class="wrap">
<p class="author">Rajabbaev Nazarbek · Student ID 202637334 · Week 12_1</p>
<h1>Code Challenge: Counter with History & Undo</h1>
<div id="root"></div>
</div>
<script type="text/babel">
const { useState } = React;

function Counter() {
  const [count, setCount] = useState(0);
  const [history, setHistory] = useState([]); // last 5 previous values

  function change(next) {
    setHistory(prev => [...prev, count].slice(-5));
    setCount(next);
  }

  function undo() {
    if (history.length === 0) return;
    setCount(history[history.length - 1]);
    setHistory(prev => prev.slice(0, -1));
  }

  return (
    <>
      <div className="count">{count}</div>
      <div className="row">
        <button onClick={() => change(count - 1)}>−1</button>
        <button onClick={() => change(count + 1)}>+1</button>
        <button className="secondary" onClick={() => change(0)}>Reset</button>
        <button className="secondary" onClick={undo} disabled={history.length === 0}>Undo</button>
      </div>
      <p style={{ textAlign: "center" }}>History (last 5):</p>
      <div className="hist">
        {history.length === 0 ? <em>empty</em> : history.map((h, i) => <span key={i}>{h}</span>)}
      </div>
    </>
  );
}

function App() { return <Counter />; }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
