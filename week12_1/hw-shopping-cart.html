<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12_1 | Homework · Campus Store Cart | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0fdfa;--card:#fff;--text:#1e293b;--muted:#64748b;--p:#0f766e;--a:#14b8a6;--soft:#ccfbf1;--line:#99f6e4}
@media(prefers-color-scheme:dark){:root{--bg:#051a0a;--card:#0b2017;--text:#d4edda;--muted:#86b89a;--p:#14b8a6;--a:#0f766e;--soft:#0f3a2a;--line:#1d5c45}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.top{background:var(--p);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.top b{font-size:1.05rem}.top span{font-size:.85rem;opacity:.9}
.wrap{max-width:980px;margin:24px auto;padding:22px;background:var(--card);border:2px solid var(--a);border-radius:16px}
h1{font-size:1.3rem;color:var(--p);margin-bottom:4px}
.lead{color:var(--muted);font-size:.9rem;margin-bottom:16px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
button{background:var(--a);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.92rem;font-weight:600;margin:4px 4px 4px 0;transition:transform .15s,background .15s}
button:hover{transform:translateY(-2px);background:var(--p)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.secondary{background:transparent;color:var(--p);border:2px solid var(--a)}
input,textarea{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:var(--card);color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
label{display:block;font-weight:600;margin:10px 0 4px;color:var(--p)}
ul{list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-left:4px solid var(--a);background:var(--soft);border-radius:0 10px 10px 0;margin-bottom:8px}
.done{text-decoration:line-through;opacity:.55}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:20px}
.shop{display:grid;grid-template-columns:1fr 2fr;gap:20px}@media(max-width:700px){.shop{grid-template-columns:1fr}}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.product{background:var(--soft);border-radius:14px;padding:12px;text-align:center}.product .emoji{font-size:2.2rem}.product h3{font-size:1rem;margin:6px 0}.cart{border:2px solid var(--a);border-radius:14px;padding:14px;align-self:start;position:sticky;top:10px}.cart h2{color:var(--p);font-size:1.1rem;margin-bottom:8px}.cart li{flex-wrap:wrap}.qty{display:flex;align-items:center;gap:4px}.qty button{padding:2px 10px;margin:0}.total{font-size:1.2rem;font-weight:700;border-top:2px dashed var(--line);padding-top:10px;color:var(--p)}
</style>
</head>
<body>
<div class="top"><b>Rajabbaev Nazarbek</b><span>ID 202637334 · K0126002 Web Programming · Week 12_1</span></div>
<div class="wrap">
<h1>Homework · Campus Store Cart</h1>
<p class="lead">6 products, a cart array, quantity buttons and a live total.</p>
<div id="root"></div>
</div>
<footer>&copy; 2026 Nazarbek · Gachon University</footer>
<script type="text/babel">
const { useState } = React;

// Task 1: 6-item product catalog
const PRODUCTS = [
  { id: 1, name: "Notebook", price: 3.5, emoji: "📓" },
  { id: 2, name: "Pen Set", price: 5.0, emoji: "🖊️" },
  { id: 3, name: "Backpack", price: 29.99, emoji: "🎒" },
  { id: 4, name: "Headphones", price: 49.0, emoji: "🎧" },
  { id: 5, name: "Water Bottle", price: 12.5, emoji: "🥤" },
  { id: 6, name: "USB Drive", price: 9.99, emoji: "💾" },
];

function ProductCard({ product, onAdd }) {
  return (
    <div className="product">
      <div className="emoji">{product.emoji}</div>
      <h3>{product.name}</h3>
      <p>${product.price.toFixed(2)}</p>
      <button onClick={() => onAdd(product)}>Add to cart</button>
    </div>
  );
}

// Task 3 + 4: sidebar with +/− controls and live total
function CartSidebar({ cart, onIncrease, onDecrease, onRemove }) {
  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const count = cart.reduce((sum, item) => sum + item.qty, 0);

  return (
    <aside className="cart">
      <h2>🛒 Cart ({count})</h2>
      {cart.length === 0 ? <p>Your cart is empty.</p> : (
        <ul>
          {cart.map(item => (
            <li key={item.id}>
              <span>{item.emoji} {item.name}</span>
              <div className="qty">
                <button className="secondary" onClick={() => onDecrease(item.id)}>−</button>
                <span>{item.qty}</span>
                <button className="secondary" onClick={() => onIncrease(item.id)}>+</button>
                <button className="secondary" onClick={() => onRemove(item.id)}>✕</button>
              </div>
            </li>
          ))}
        </ul>
      )}
      <p className="total">Total: ${total.toFixed(2)}</p>
    </aside>
  );
}

// Task 5: ShoppingCart brings everything together
function ShoppingCart() {
  // Task 2: cart state is an array of { ...product, qty }
  const [cart, setCart] = useState([]);

  function addToCart(product) {
    setCart(prev => {
      const found = prev.find(i => i.id === product.id);
      if (found) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      return [...prev, { ...product, qty: 1 }];
    });
  }

  const increase = id => setCart(prev => prev.map(i => i.id === id ? { ...i, qty: i.qty + 1 } : i));
  const decrease = id => setCart(prev =>
    prev.map(i => i.id === id ? { ...i, qty: i.qty - 1 } : i).filter(i => i.qty > 0)
  );
  const remove = id => setCart(prev => prev.filter(i => i.id !== id));

  return (
    <div className="shop">
      <CartSidebar cart={cart} onIncrease={increase} onDecrease={decrease} onRemove={remove} />
      <div className="products">
        {PRODUCTS.map(p => <ProductCard key={p.id} product={p} onAdd={addToCart} />)}
      </div>
    </div>
  );
}

function App() { return <ShoppingCart />; }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
