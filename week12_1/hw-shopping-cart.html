<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12_1 | Homework: Interactive Shopping Cart | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}
.wrap{max-width:960px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.author{font-size:.85rem;color:#64748b;margin:0 0 4px}
h1{font-size:1.35rem;margin:0 0 16px;color:#4f46e5}
button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.95rem;margin:4px 4px 4px 0}
button.secondary{background:#e2e8f0;color:#0f172a}
button:hover{opacity:.9}
input,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-family:inherit}
label{display:block;font-weight:600;margin:10px 0 4px}
ul{padding-left:0;list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
.done{text-decoration:line-through;color:#94a3b8}
.msg{margin-top:12px;padding:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534} .err{background:#fee2e2;color:#991b1b}

.shop{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:700px){.shop{grid-template-columns:1fr}}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.product{border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center}
.product .emoji{font-size:2.2rem}.product h3{font-size:1rem;margin:6px 0}
.cart{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;align-self:start;position:sticky;top:10px}
.cart li{flex-wrap:wrap}.qty{display:flex;align-items:center;gap:4px}.qty button{padding:2px 9px;margin:0}
.total{font-size:1.2rem;font-weight:700;border-top:1px solid #cbd5e1;padding-top:10px}</style>
</head>
<body>
<div class="wrap">
<p class="author">Rajabbaev Nazarbek · Student ID 202637334 · Week 12_1</p>
<h1>Homework: Interactive Shopping Cart</h1>
<div id="root"></div>
</div>
<script type="text/babel">
const { useState } = React;

// Task 1: 6-item product catalog
const PRODUCTS = [
  { id: 1, name: "Notebook", price: 3.5, emoji: "📓" },
  { id: 2, name: "Pen Set", price: 5.0, emoji: "🖊️" },
  { id: 3, name: "Backpack", price: 29.99, emoji: "🎒" },
  { id: 4, name: "Headphones", price: 49.0, emoji: "🎧" },
  { id: 5, name: "Water Bottle", price: 12.5, emoji: "🥤" },
  { id: 6, name: "USB Drive", price: 9.99, emoji: "💾" },
];

function ProductCard({ product, onAdd }) {
  return (
    <div className="product">
      <div className="emoji">{product.emoji}</div>
      <h3>{product.name}</h3>
      <p>${product.price.toFixed(2)}</p>
      <button onClick={() => onAdd(product)}>Add to cart</button>
    </div>
  );
}

// Task 3 + 4: sidebar with +/− controls and live total
function CartSidebar({ cart, onIncrease, onDecrease, onRemove }) {
  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const count = cart.reduce((sum, item) => sum + item.qty, 0);

  return (
    <aside className="cart">
      <h2>🛒 Cart ({count})</h2>
      {cart.length === 0 ? <p>Your cart is empty.</p> : (
        <ul>
          {cart.map(item => (
            <li key={item.id}>
              <span>{item.emoji} {item.name}</span>
              <div className="qty">
                <button className="secondary" onClick={() => onDecrease(item.id)}>−</button>
                <span>{item.qty}</span>
                <button className="secondary" onClick={() => onIncrease(item.id)}>+</button>
                <button className="secondary" onClick={() => onRemove(item.id)}>✕</button>
              </div>
            </li>
          ))}
        </ul>
      )}
      <p className="total">Total: ${total.toFixed(2)}</p>
    </aside>
  );
}

// Task 5: ShoppingCart brings everything together
function ShoppingCart() {
  // Task 2: cart state is an array of { ...product, qty }
  const [cart, setCart] = useState([]);

  function addToCart(product) {
    setCart(prev => {
      const found = prev.find(i => i.id === product.id);
      if (found) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      return [...prev, { ...product, qty: 1 }];
    });
  }

  const increase = id => setCart(prev => prev.map(i => i.id === id ? { ...i, qty: i.qty + 1 } : i));
  const decrease = id => setCart(prev =>
    prev.map(i => i.id === id ? { ...i, qty: i.qty - 1 } : i).filter(i => i.qty > 0)
  );
  const remove = id => setCart(prev => prev.filter(i => i.id !== id));

  return (
    <div className="shop">
      <div className="products">
        {PRODUCTS.map(p => <ProductCard key={p.id} product={p} onAdd={addToCart} />)}
      </div>
      <CartSidebar cart={cart} onIncrease={increase} onDecrease={decrease} onRemove={remove} />
    </div>
  );
}

function App() { return <ShoppingCart />; }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
