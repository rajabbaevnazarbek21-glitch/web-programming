<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 11_2 | E6: Track Assignment Progress | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}
.wrap{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.author{font-size:.85rem;color:#64748b;margin:0 0 4px}
h1{font-size:1.35rem;margin:0 0 16px;color:#4f46e5}
button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.95rem;margin:4px 4px 4px 0}
button.secondary{background:#e2e8f0;color:#0f172a}
button:hover{opacity:.9}
input,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-family:inherit}
label{display:block;font-weight:600;margin:10px 0 4px}
ul{padding-left:0;list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
.done{text-decoration:line-through;color:#94a3b8}
.msg{margin-top:12px;padding:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534} .err{background:#fee2e2;color:#991b1b}

.filters{margin-bottom:10px}.filters button.active{background:#16a34a}
li label{display:flex;align-items:center;gap:8px;margin:0;font-weight:400}li input{width:auto}
</style>
</head>
<body>
<div class="wrap">
<p class="author">Rajabbaev Nazarbek · Student ID 202637334 · Week 11_2</p>
<h1>E6: Track Assignment Progress</h1>
<div id="root"></div>
</div>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tasks, setTasks] = useState([
    { id: 1, text: "Database report", done: false },
    { id: 2, text: "Week 11 React props", done: true },
    { id: 3, text: "Capital punishment slides", done: false },
  ]);
  const [filter, setFilter] = useState("all");

  function toggle(id) {
    // map returns a new array with the changed task
    setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
  }

  function clearCompleted() {
    setTasks(prev => prev.filter(t => !t.done));
  }

  const visible = tasks.filter(t =>
    filter === "all" ? true : filter === "done" ? t.done : !t.done
  );

  return (
    <>
      <div className="filters">
        {["all", "active", "done"].map(f => (
          <button key={f} className={filter === f ? "active" : ""} onClick={() => setFilter(f)}>
            {f}
          </button>
        ))}
      </div>
      <ul>
        {visible.map(t => (
          <li key={t.id}>
            <label>
              <input type="checkbox" checked={t.done} onChange={() => toggle(t.id)} />
              <span className={t.done ? "done" : ""}>{t.text}</span>
            </label>
          </li>
        ))}
      </ul>
      <p>{tasks.filter(t => t.done).length} of {tasks.length} done</p>
      <button className="secondary" onClick={clearCompleted}>Clear completed</button>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
