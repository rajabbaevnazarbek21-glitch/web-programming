<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 11_2 | E7 · Student Check-in | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0fdfa;--card:#fff;--text:#1e293b;--muted:#64748b;--p:#0f766e;--a:#14b8a6;--soft:#ccfbf1;--line:#99f6e4}
@media(prefers-color-scheme:dark){:root{--bg:#051a0a;--card:#0b2017;--text:#d4edda;--muted:#86b89a;--p:#14b8a6;--a:#0f766e;--soft:#0f3a2a;--line:#1d5c45}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.top{background:var(--p);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.top b{font-size:1.05rem}.top span{font-size:.85rem;opacity:.9}
.wrap{max-width:600px;margin:24px auto;padding:22px;background:var(--card);border:2px solid var(--a);border-radius:16px}
h1{font-size:1.3rem;color:var(--p);margin-bottom:4px}
.lead{color:var(--muted);font-size:.9rem;margin-bottom:16px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
button{background:var(--a);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.92rem;font-weight:600;margin:4px 4px 4px 0;transition:transform .15s,background .15s}
button:hover{transform:translateY(-2px);background:var(--p)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.secondary{background:transparent;color:var(--p);border:2px solid var(--a)}
input,textarea{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:var(--card);color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
label{display:block;font-weight:600;margin:10px 0 4px;color:var(--p)}
ul{list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-left:4px solid var(--a);background:var(--soft);border-radius:0 10px 10px 0;margin-bottom:8px}
.done{text-decoration:line-through;opacity:.55}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:20px}

</style>
</head>
<body>
<div class="top"><b>Rajabbaev Nazarbek</b><span>ID 202637334 · K0126002 Web Programming · Week 11_2</span></div>
<div class="wrap">
<h1>E7 · Student Check-in</h1>
<p class="lead">Two inputs stored in one state object.</p>
<div id="root"></div>
</div>
<footer>&copy; 2026 Nazarbek · Gachon University</footer>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  // two fields kept in ONE state object
  const [form, setForm] = useState({ name: "", studentId: "" });
  const [message, setMessage] = useState(null);

  function handleChange(e) {
    const { name, value } = e.target;
    setForm(prev => ({ ...prev, [name]: value }));
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (form.name.trim() === "" || !/^\d{9}$/.test(form.studentId)) {
      setMessage({ ok: false, text: "Please enter your name and a 9-digit student ID." });
    } else {
      setMessage({ ok: true, text: `Profile OK: ${form.name} (${form.studentId})` });
    }
  }

  return (
    <form onSubmit={handleSubmit}>
      <label htmlFor="name">Name</label>
      <input id="name" name="name" value={form.name} onChange={handleChange} />
      <label htmlFor="studentId">Student ID</label>
      <input id="studentId" name="studentId" value={form.studentId} onChange={handleChange} />
      <button type="submit" style={{ marginTop: 12 }}>Check profile</button>
      {message && <div className={`msg ${message.ok ? "ok" : "err"}`}>{message.text}</div>}
    </form>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
