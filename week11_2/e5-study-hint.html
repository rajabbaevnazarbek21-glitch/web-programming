<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 11_2 | E5: Reveal a Study Hint | Rajabbaev Nazarbek</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}
.wrap{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.author{font-size:.85rem;color:#64748b;margin:0 0 4px}
h1{font-size:1.35rem;margin:0 0 16px;color:#4f46e5}
button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.95rem;margin:4px 4px 4px 0}
button.secondary{background:#e2e8f0;color:#0f172a}
button:hover{opacity:.9}
input,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-family:inherit}
label{display:block;font-weight:600;margin:10px 0 4px}
ul{padding-left:0;list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
.done{text-decoration:line-through;color:#94a3b8}
.msg{margin-top:12px;padding:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534} .err{background:#fee2e2;color:#991b1b}

.hint{margin-top:12px;padding:12px;background:#fef9c3;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<p class="author">Rajabbaev Nazarbek · Student ID 202637334 · Week 11_2</p>
<h1>E5: Reveal a Study Hint</h1>
<div id="root"></div>
</div>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [showHint, setShowHint] = useState(false);

  return (
    <>
      <p><strong>Question:</strong> Why must a list item in React have a <code>key</code>?</p>
      <button
        aria-expanded={showHint}
        aria-controls="hint"
        onClick={() => setShowHint(s => !s)}
      >
        {showHint ? "Hide hint" : "Show hint"}
      </button>
      {showHint && (
        <div id="hint" className="hint">
          💡 Keys let React know which item changed, was added, or was removed.
        </div>
      )}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
