<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sample 01 | Latest Posts</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">Back to Week 6</a>
    <p class="eyebrow">Sample 01 · Fetch and render</p>
    <h1>Latest Posts</h1>
    <p class="lede">Load a set of posts from a public API and build the page from the response.</p>
    <section class="panel demo-panel" aria-label="Posts demo">
      <div class="demo-heading">
        <p class="eyebrow">JSONPlaceholder</p>
        <h2>Post feed</h2>
      </div>
      <button id="load-posts" type="button">Load posts</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="posts" class="post-grid"></div>
    </section>
  </main>
  <script>
    const status = document.querySelector('#status');
    const postsContainer = document.querySelector('#posts');
    const loadButton = document.querySelector('#load-posts');

    loadButton.addEventListener('click', async () => {
      status.textContent = 'Loading posts…';
      status.dataset.state = 'loading';
      postsContainer.replaceChildren();
      loadButton.disabled = true;

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=10');
        if (!response.ok) throw new Error(`The server responded with ${response.status}.`);
        const posts = await response.json();
        if (!Array.isArray(posts)) throw new Error('The response did not contain a posts list.');

        const cards = posts.map((post, index) => {
          const article = document.createElement('article');
          article.className = 'post-card';

          const number = document.createElement('span');
          number.className = 'post-index';
          number.textContent = `Post ${String(index + 1).padStart(2, '0')}`;

          const title = document.createElement('h2');
          title.textContent = post.title;

          const body = document.createElement('p');
          body.textContent = post.body;
          article.append(number, title, body);
          return article;
        });

        postsContainer.replaceChildren(...cards);
        status.textContent = `Loaded ${posts.length} posts successfully.`;
        status.dataset.state = 'success';
      } catch (error) {
        status.textContent = `Could not load posts. ${error.message}`;
        status.dataset.state = 'error';
      } finally {
        loadButton.disabled = false;
        console.log('Request finished.');
      }
    });
  </script>
</body>
</html>
