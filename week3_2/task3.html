<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3 - Spinner</title>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f0fdfa; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 50px; height: 50px; border: 4px solid #ccfbf1; border-top-color: #0f766e; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <div class="spinner" aria-label="Loading"></div>
</body>
</html>
