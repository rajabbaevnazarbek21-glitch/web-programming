<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 1 - Position the Badge</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0fdfa; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card {
      position: relative; width: 280px; height: 180px; background: white; border: 2px solid #14b8a6; border-radius: 12px;
      box-shadow: 0 10px 20px rgba(15,118,110,0.08); display: flex; align-items: center; justify-content: center; color: #0f766e; font-weight: bold;
    }
    .badge {
      position: absolute; top: 12px; right: 14px; background: #0f766e; color: white; border-radius: 999px; padding: 6px 12px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
     Nazarbek Collection
  </div>
</body>
</html>
