<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 6 - Responsive Grid Page</title>
  <style>
    :root {
      --bg: #f0fdfa; --card: #ffffff; --primary: #0f766e; --accent: #14b8a6; --text: #0f172a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .card { position: relative; background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid #dbeafe; transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .card::before { content: '✨ '; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(15,118,110,0.14); }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #04150e; --card: #0b2017; --text: #d4edda; --primary: #2dd4bf; --accent: #5eead4; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <article class="card">HTML</article>
    <article class="card">CSS</article>
    <article class="card">JavaScript</article>
    <article class="card">UX</article>
    <article class="card">Responsive</article>
    <article class="card">Animation</article>
  </div>
</body>
</html>
