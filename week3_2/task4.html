<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 4 - CSS Variables Theme</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #1e293b;
      --radius: 12px;
      --spacing: 20px;
    }
    body {
      margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); padding: var(--spacing);
    }
    .btn {
      background: var(--primary); color: white; border: none; border-radius: var(--radius); padding: 10px 22px; cursor: pointer;
    }
    .card {
      background: white; border: 2px solid var(--accent); border-radius: var(--radius); padding: var(--spacing); margin-top: var(--spacing);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #051a0a;
        --text: #d4edda;
        --primary: #2dd4bf;
        --accent: #5eead4;
      }
      .card { background: #0b2017; }
    }
  </style>
</head>
<body>
  <button class="btn">Nazarbek Theme</button>
  <div class="card">This page uses CSS variables and a dark-mode override.</div>
</body>
</html>
