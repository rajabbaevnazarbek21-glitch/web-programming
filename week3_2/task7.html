<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 7 - Portfolio Page</title>
  <style>
    :root {
      --primary: #0f766e; --accent: #14b8a6; --bg: #f0fdfa; --card: #ffffff; --text: #1e293b; --dark: #0f172a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    nav {
      position: fixed; top: 0; left: 0; right: 0; background: var(--dark); color: white; display: flex; justify-content: space-between; align-items: center; padding: 16px 30px; z-index: 20;
    }
    nav a { color: white; text-decoration: none; margin-left: 18px; }
    nav a:hover { color: #5eead4; }
    .hero { padding: 120px 30px 40px; text-align: center; animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .hero h1 { color: var(--primary); }
    .heading { position: sticky; top: 72px; background: #ccfbf1; padding: 12px 30px; font-weight: bold; color: var(--primary); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px 30px 40px; }
    .card { background: var(--card); border-radius: 12px; padding: 22px; border: 1px solid #dbeafe; transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .card::before { content: '✨ '; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(15,118,110,0.15); }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #04150e; --card: #0b2017; --text: #d4edda; --dark: #020817; }
    }
  </style>
</head>
<body>
  <nav>
    <div>Nazarbek</div>
    <div><a href="#">Home</a><a href="#">Skills</a><a href="#">Contact</a></div>
  </nav>
  <section class="hero">
    <h1>Nazarbek</h1>
    <p>Web Programming Student • Gachon University</p>
  </section>
  <div class="heading">My Skills</div>
  <section class="grid">
    <article class="card">HTML</article>
    <article class="card">CSS</article>
    <article class="card">Responsive Design</article>
    <article class="card">Animation</article>
    <article class="card">UI Design</article>
    <article class="card">JavaScript</article>
  </section>
</body>
</html>
