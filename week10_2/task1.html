<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - Page Not Found | Nazarbek</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0a0a12;color:#fff;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;width:280px;height:280px;opacity:.25;pointer-events:none;
background:repeating-radial-gradient(circle at 0 0, transparent 0 30px, rgba(255,255,255,.25) 30px 31px),repeating-conic-gradient(from 0deg at 0 0, transparent 0 15deg, rgba(255,255,255,.15) 15deg 16deg);}
header{padding:20px 28px;display:flex;justify-content:space-between}
header a{color:#fff;text-decoration:none;font-weight:700}
nav a{color:#a1a1aa;text-decoration:none;margin-left:18px}
main{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#14141c;border:1px solid #2a2a35;border-radius:4px;padding:36px 32px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid #d4af37}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.badge{display:inline-block;background:#7f1d1d;color:#fff;font-size:11px;letter-spacing:1px;padding:4px 8px;border-radius:3px;font-weight:700}
h1{font-size:32px;line-height:1.2;margin:16px 0 12px}
p.desc{color:#a1a1aa;font-size:14px;line-height:1.6;margin-bottom:22px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 18px;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}
.btn-gold{background:#d4af37;color:#111}
.btn-dark{background:#1f1f28;color:#fff;border:1px solid #333}
footer{text-align:center;color:#71717a;font-size:12px;padding:14px 0 22px}
@media(max-width:480px){.btns{flex-direction:column}.btn{width:100%}}
</style></head>
<body>
<header><a href="index.html">Nazarbek — Web Programming</a><nav><a href="index.html">Home</a><a href="index.html">Projects</a></nav></header>
<main>

</div>
</div>
</main>
