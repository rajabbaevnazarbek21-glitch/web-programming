<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>setCustomValidity()</title><style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#1e293b;line-height:1.5}
  h1{font-size:32px;margin-bottom:8px} p{color:#475569}
  label{font-weight:700;display:block;margin:22px 0 6px}
  input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
  input:focus{outline:2px solid #2563eb;border-color:#2563eb}
  input:invalid{border-color:#fca5a5} button{background:#2563eb;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:16px;font-size:16px}
  button:disabled{background:#94a3b8;cursor:not-allowed}
  .card{background:#f8fafc;padding:14px 16px;border-radius:8px;margin-top:16px}
  .error{color:#dc2626;font-weight:600} .ok{color:#16a34a;font-weight:600}
  .hint{color:#64748b;font-size:14px} a{color:#2563eb}
</style></head>
<body>
<h1>setCustomValidity()</h1>
<p>Type two different passwords, then press Submit.</p>
<form id="f" novalidate>
<label for="pw">Password</label>
<input id="pw" type="password" required minlength="4">
<label for="pw2">Confirm password</label>
<input id="pw2" type="password" required aria-describedby="err">
<p id="err" class="error" role="alert"></p>
<button type="submit">Submit</button>
<p id="ok" class="ok"></p>
</form>
<script>
const pw=document.getElementById('pw'), pw2=document.getElementById('pw2'), err=document.getElementById('err'), ok=document.getElementById('ok'), f=document.getElementById('f');
function check(){
  if(pw2.value && pw.value!==pw2.value){ pw2.setCustomValidity('Passwords do not match.'); err.textContent='Passwords do not match.'; }
  else { pw2.setCustomValidity(''); err.textContent=''; }
}
pw.addEventListener('input', check); pw2.addEventListener('input', check);
f.addEventListener('submit', e=>{
  e.preventDefault(); check();
  if(!f.checkValidity()){ f.reportValidity(); return; }
  ok.textContent='✅ Passwords match! Form is valid.';
});
</script>
</body></html>
