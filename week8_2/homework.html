<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Registration Form - Week 8-2</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f1f5f9;margin:0;padding:32px 16px;color:#1e293b}
.card{max-width:520px;margin:0 auto;background:#fff;padding:32px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
h1{text-align:center;font-size:26px} p.sub{text-align:center;color:#64748b}
label{font-weight:700;display:block;margin:18px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
input:focus,select:focus{outline:2px solid #2563eb}
input[aria-invalid="true"]{border-color:#dc2626}
button{width:100%;background:#2563eb;color:#fff;border:0;padding:15px;border-radius:8px;font-weight:800;font-size:17px;cursor:pointer;margin-top:24px}
button:disabled{background:#94a3b8;cursor:not-allowed}
.error{color:#dc2626;font-size:14px;margin:6px 0 0} .ok{color:#16a34a;text-align:center;font-weight:700;font-size:16px}
.hint{color:#64748b;font-size:13px}
</style></head>
<body>
<div class="card">
<h1>Student Registration Form</h1>
<p class="sub">Week 8-2 — Proper JS Form Validation • novalidate + Validity API + aria-invalid</p>
<form id="f" novalidate>
<label for="name">Full Name</label>
<input id="name" type="text" required minlength="2" aria-describedby="e-name" aria-invalid="false" placeholder="Nazarbek Rajabbaev">
<p id="e-name" class="error" role="alert"></p>
<label for="sid">Student ID (Gachon)</label>
<input id="sid" type="text" required pattern="[0-9]{9}" aria-describedby="e-sid" aria-invalid="false" placeholder="202412345">
<p id="e-sid" class="error" role="alert"></p>
<p class="hint">9 digits, e.g. 202412345</p>
<label for="email">Email</label>
<input id="email" type="email" required aria-describedby="e-email" aria-invalid="false" placeholder="name@gachon.ac.kr">
<p id="e-email" class="error" role="alert"></p>
<label for="course">Course</label>
<select id="course" required aria-describedby="e-course" aria-invalid="false">
<option value="">-- Select course --</option>
<option>Web Programming K0126_002</option>
<option>Database</option>
<option>Computer Networks</option>
</select>
<p id="e-course" class="error" role="alert"></p>
<label for="pw">Password</label>
<input id="pw" type="password" required minlength="8" aria-describedby="e-pw" aria-invalid="false">
<p id="e-pw" class="error" role="alert"></p>
<label for="pw2">Confirm Password</label>
<input id="pw2" type="password" required aria-describedby="e-pw2" aria-invalid="false">
<p id="e-pw2" class="error" role="alert"></p>
<button id="btn" type="submit" disabled>Register Student</button>
<p id="success" class="ok"></p>
</form>
</div>
<script>
const f=document.getElementById('f'), btn=document.getElementById('btn');
const name=document.getElementById('name'), sid=document.getElementById('sid'), email=document.getElementById('email'), course=document.getElementById('course'), pw=document.getElementById('pw'), pw2=document.getElementById('pw2');
function show(el,id,msg){ document.getElementById(id).textContent=msg; el.setAttribute('aria-invalid',msg?'true':'false'); }
function validate(){
  let ok=true;
  if(name.validity.valueMissing){ show(name,'e-name','Full name is required.'); ok=false; } else if(name.validity.tooShort){ show(name,'e-name','At least 2 characters.'); ok=false; } else show(name,'e-name','');
  if(sid.validity.valueMissing){ show(sid,'e-sid','Student ID is required.'); ok=false; } else if(sid.validity.patternMismatch){ show(sid,'e-sid','Student ID must be 9 digits.'); ok=false; } else show(sid,'e-sid','');
  if(email.validity.valueMissing){ show(email,'e-email','Email is required.'); ok=false; } else if(email.validity.typeMismatch){ show(email,'e-email','Must be a valid email.'); ok=false; } else show(email,'e-email','');
  if(!course.value){ show(course,'e-course','Please select a course.'); ok=false; } else show(course,'e-course','');
  if(pw.validity.valueMissing){ show(pw,'e-pw','Password is required.'); ok=false; } else if(pw.validity.tooShort){ show(pw,'e-pw','At least 8 characters.'); ok=false; } else show(pw,'e-pw','');
  if(pw2.value && pw.value!==pw2.value){ pw2.setCustomValidity('Passwords do not match.'); show(pw2,'e-pw2','Passwords do not match.'); ok=false; } else if(pw2.validity.valueMissing){ show(pw2,'e-pw2','Confirm your password.'); ok=false; } else { pw2.setCustomValidity(''); show(pw2,'e-pw2',''); }
  btn.disabled = !(name.value && sid.value && email.value && course.value && pw.value && pw2.value && ok);
  return ok;
}
[name,sid,email,course,pw,pw2].forEach(el=>el.addEventListener('input', validate));
f.addEventListener('submit', e=>{ e.preventDefault(); if(validate()) document.getElementById('success').textContent='✅ Registered! Welcome, '+name.value+' ('+sid.value+') - '+course.value; });
validate();
</script>
</body></html>
