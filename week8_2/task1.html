<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>novalidate</title><style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#1e293b;line-height:1.5}
  h1{font-size:32px;margin-bottom:8px} p{color:#475569}
  label{font-weight:700;display:block;margin:22px 0 6px}
  input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
  input:focus{outline:2px solid #2563eb;border-color:#2563eb}
  input:invalid{border-color:#fca5a5} button{background:#2563eb;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:16px;font-size:16px}
  button:disabled{background:#94a3b8;cursor:not-allowed}
  .card{background:#f8fafc;padding:14px 16px;border-radius:8px;margin-top:16px}
  .error{color:#dc2626;font-weight:600} .ok{color:#16a34a;font-weight:600}
  .hint{color:#64748b;font-size:14px} a{color:#2563eb}
</style></head>
<body>
<h1>novalidate</h1>
<p>Submit both forms with an empty email.</p>

<h2>Without novalidate — browser bubble</h2>
<form id="form1">
<label for="email1">Email</label>
<input id="email1" type="email" required placeholder="">
<button type="submit">Submit</button>
</form>

<h2>With novalidate — JavaScript shows the error</h2>
<form id="form2" novalidate>
<label for="email2">Email</label>
<input id="email2" type="email" required aria-describedby="err2" aria-invalid="false">
<p id="err2" class="error" role="alert"></p>
<button type="submit">Submit</button>
<p id="msg2" class="ok"></p>
</form>

<script>
const f2=document.getElementById('form2'), e2=document.getElementById('email2'),
err=document.getElementById('err2'), msg=document.getElementById('msg2');
f2.addEventListener('submit', ev=>{
  ev.preventDefault(); err.textContent=''; msg.textContent='';
  if(e2.validity.valueMissing){ err.textContent='Email is required.'; e2.setAttribute('aria-invalid','true'); }
  else if(e2.validity.typeMismatch){ err.textContent='Must be a valid email address.'; e2.setAttribute('aria-invalid','true'); }
  else { e2.setAttribute('aria-invalid','false'); msg.textContent='✅ Submitted: '+e2.value; }
});
</script>
</body></html>
