['E3 · Interactive To-Do List','<style>body{font-family:system-ui;max-width:380px;margin:auto}#todo-list{list-style:none;padding:0}.todo-item{display:flex;justify-content:space-between;padding:8px 12px;margin-bottom:6px;background:#f0f4ff;border-radius:8px}.del-btn{background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer}#empty-msg{color:#9ca3af;text-align:center}</style>\n<h2>My To-Do List</h2><input id="todo-input" placeholder="Add a task..."> <button id="add-btn">+ Add</button>\n<ul id="todo-list"></ul><p id="empty-msg">No tasks yet!</p>\n<script>\nconst inp=document.querySelector("#todo-input"),list=document.querySelector("#todo-list"),empty=document.querySelector("#empty-msg");\nfunction check(){empty.style.display=list.children.length?"none":"block";}\nfunction addTask(){const t=inp.value.trim();if(!t)return;const li=document.createElement("li");li.className="todo-item";const s=document.createElement("span");s.textContent=t;const d=document.createElement("button");d.className="del-btn";d.textContent="✕";li.append(s,d);list.appendChild(li);inp.value="";check();}\ndocument.querySelector("#add-btn").addEventListener("click",addTask);\ninp.addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});\nlist.addEventListener("click",e=>{if(e.target.matches(".del-btn")){e.target.closest("li").remove();check();}});\n<\/script>'],
['E4 · Live Search Filter','<style>body{font-family:system-ui;max-width:400px;margin:auto}#search{width:100%;padding:8px;font-size:16px;border:2px solid #1a56db;border-radius:10px;margin-bottom:10px}.student{padding:8px 12px;margin-bottom:5px;background:#f0f4ff;border-radius:8px}mark{background:#f7df1e}#no-results{display:none;color:#9ca3af;text-align:center}</style>\n<input id="search" placeholder="Search students...">\n<div><div class="student" data-name="Kim Jisoo">Kim Jisoo — Web Programming</div><div class="student" data-name="Park Minjun">Park Minjun — Computer Science</div><div class="student" data-name="Lee Sooyeon">Lee Sooyeon — Software Engineering</div><div class="student" data-name="Jung Yuna">Jung Yuna — Data Science</div></div>\n<p id="no-results">No students found.</p>\n<script>\nconst rows=document.querySelectorAll(".student"),none=document.querySelector("#no-results");\ndocument.querySelector("#search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();let shown=0;\nrows.forEach(r=>{const name=r.dataset.name,i=name.toLowerCase().indexOf(q),ok=i>-1;r.style.display=ok?"":"none";if(ok){shown++;r.innerHTML=q?name.slice(0,i)+"<mark>"+name.slice(i,i+q.length)+"</mark>"+name.slice(i+q.length)+" — "+r.textContent.split(" — ")[1]:name+" — "+r.textContent.split(" — ")[1];}});\nnone.style.display=shown?"none":"block";});\n<\/script>']
]}

const app=document.getElementById('app');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 const k=location.hash.slice(1),w=weeks[k];
 if(!w){
  app.innerHTML='<h2 style="color:var(--p);margin-bottom:6px">Homework</h2><p style="margin-bottom:16px">Hi, I am Nazarbek. Choose a week:</p><div class="grid">'+Object.keys(weeks).map(x=>'<a class="tile" href="#'+x+'"><b>'+x+'</b>'+weeks[x].t+'<br><small>'+weeks[x].d+'</small></a>').join('')+'</div>';
 }else{
  app.innerHTML='<a class="back" href="#">← Home</a><h2 style="color:var(--p);margin-bottom:14px">'+w.t+'</h2>'+w.ex.map((e,i)=>'<div class="ex"><h3>'+e[0]+'</h3><iframe sandbox="allow-scripts" title="'+e[0]+'"></iframe><details><summary>Show code</summary><pre>'+esc(W(e[1]))+'</pre></details></div>').join('');
  app.querySelectorAll('iframe').forEach((f,i)=>f.srcdoc=W(w.ex[i][1]));
 }
 scrollTo(0,0);
}
addEventListener('hashchange',render);render();
</script>
